<details class="proposal-details"><summary>本輪提案範圍與待補美術</summary><p>四張新生成的水彩概念資產供確認：群島背景、六門城池背景、小貓與木船、花草增長圖層。它們尚未經作者核定，也不是可直接宣稱完成的正式分層場景。</p><p>本預覽的霧、航線、互動標記、道路光與燈光是獨立網頁圖層；背景中的門樓、原有植物、人物仍畫在同一張圖上，正式製作需再拆出門、守門者、使者、植栽及角色動作。</p><p>初始／完成次數是視覺狀態示範，不寫入或清除原型進度。原閱讀器、存檔、解鎖與經典對照維持第一版。</p><a href="../../docs/play/visual-v2/ART-BRIEF.md">美術尺寸與素材清單</a> · <a href="../../docs/play/visual-v2/COMPOSITION.md">構圖與分層方案</a></details></main>
