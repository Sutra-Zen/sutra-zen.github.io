<details class="proposal-details"><summary>本輪提案範圍與待補美術</summary><p>本輪可切換原水彩、塔防地景、奇幻世界三種地圖，另有無棋格的俯視六門城池與直式裝幀書封。新生成的地圖與城池是待確認的概念畫稿；原繪本插畫及閱讀內容保留。</p><p>主題標籤、航線、互動熱區、道路光與燈光是獨立網頁圖層；新背景的山峰、門樓與人物仍在整張畫稿中，尚未全部拆成可獨立動畫的正式素材。</p><p>城池初始／完成次數是視覺狀態示範，不寫入或清除閱讀進度。收集書架仍按原有完成條件解鎖封面，保留續讀、備份與經典對照。</p><a href="../../docs/play/visual-v2/ART-BRIEF.md">美術尺寸與素材清單</a> · <a href="../../docs/play/visual-v2/ART-DIRECTIONS.md">本輪畫風與書封說明</a> · <a href="../../docs/play/visual-v2/COMPOSITION.md">構圖與分層方案</a></details></main>
